plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fennxystudios.apartmenttycoon'
    compileSdk 34

    defaultConfig {
        applicationId "com.fennxystudios.apartmenttycoon"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero external dependencies so AIDE and Android Studio compile cleanly offline
}
